[project]
name = "url-shortner"
version = "0.1.0"
description = "A simple CLI utility to generate short URLs"
readme = "README.md"
authors = [
    { name = "Daniele", email = "daniele.marsella95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.9.0",
    "pymongo>=4.18.3",
]

[project.scripts]
url-shortner = "url_shortner:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
